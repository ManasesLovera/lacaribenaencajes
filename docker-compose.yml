services:
  db:
    image: postgres:16-alpine
    container_name: lacaribena-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lacaribena}
      POSTGRES_USER: ${POSTGRES_USER:-lacaribena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lacaribena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lacaribena} -d ${POSTGRES_DB:-lacaribena}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
